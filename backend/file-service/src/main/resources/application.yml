server:
  port: 8086

spring:
  application:
    name: file-service
  servlet:
    multipart:
      # 8MB：封面图与帖子配图常来自手机直出照片（3–8MB），
      # 原来卡在 5MB 会让「上传封面」这类场景直接失败。
      # 前端还会先在浏览器里等比压缩（见 ImageUploader），这里是最后一道兜底。
      max-file-size: 8MB
      max-request-size: 12MB
  data:
    redis:
      host: ${REDIS_HOST:192.168.198.139}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1s
      repositories:
        enabled: false
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.198.139:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        ip: ${NACOS_INSTANCE_IP:}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.198.139:8858}
      eager: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:chengqu-huzhu-jwt-secret-key-change-me-in-production-2026}
    access-token-expire-minutes: ${JWT_ACCESS_EXPIRE_MINUTES:30}
    refresh-token-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:7}
    revocation-fail-closed: ${JWT_REVOCATION_FAIL_CLOSED:false}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://192.168.198.139:9000}
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY:admin123456}
    bucket: ${MINIO_BUCKET:urpic}

logging:
  level:
    root: INFO
    com.chengqu.huzhu: INFO
