server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**,/api/admin/**,/api/user/**
        - id: aid-service
          uri: lb://aid-service
          predicates:
            - Path=/api/aid/**
        - id: community-service
          uri: lb://community-service
          predicates:
            - Path=/api/community/**
        - id: ad-service
          uri: lb://ad-service
          predicates:
            - Path=/api/ad/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.chengqu.huzhu: INFO
