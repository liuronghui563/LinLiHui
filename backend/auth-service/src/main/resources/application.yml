server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    # 生产环境请通过环境变量注入，不要依赖下面的开发默认值
    url: "${DB_URL:jdbc:mysql://192.168.198.139:3306/LinLiHui?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 3
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      jpa:
        open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:192.168.198.139}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
      # 超时设短一些：Redis 是辅助设施，不应让请求长时间挂住
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1s
      # 本项目不使用 Spring Data Redis Repository（只用 RedisTemplate），
      # 关闭扫描以免启动日志出现无关的仓库探测警告
      repositories:
        enabled: false
  jpa:
    hibernate:
      # 建表与变更统一由 Flyway 负责，此处只校验实体与表结构是否一致
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 四个服务共用一个库，各自使用独立的历史表，避免互相干扰
    table: flyway_schema_history_auth
    baseline-on-migrate: true
    baseline-version: 0
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.198.139:8848}
        # 当前 Nacos 未开启鉴权，留空即可；开启后通过环境变量注入
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        # 注册到 Nacos 的实例地址，集群部署时建议显式指定为可被其他节点访问的 IP
        ip: ${NACOS_INSTANCE_IP:}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.198.139:8858}
      eager: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# 服务间调用：Feign 超时与重试
feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connect-timeout: 2000
        read-timeout: 4000
        logger-level: basic

app:
  # 内部码登录口令。原先硬编码在 AuthService 中，现已外置。
  # 生产环境务必通过 INTERNAL_LOGIN_CODE 覆盖，或置空以彻底关闭该登录方式。
  internal-login-code: ${INTERNAL_LOGIN_CODE:8461}
  # 敏感接口限流（基于 Redis 固定窗口；Redis 不可用时自动放行）
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # 同一 IP 每分钟的登录尝试次数
    login-per-minute-per-ip: ${RATE_LIMIT_LOGIN_IP:20}
    # 同一手机号每分钟的登录尝试次数（防止换 IP 撞库）
    login-per-minute-per-phone: ${RATE_LIMIT_LOGIN_PHONE:10}
    # 同一 IP 每小时的注册次数
    register-per-hour-per-ip: ${RATE_LIMIT_REGISTER_IP:10}
    # 同一 IP 每分钟的短信下发次数
    sms-per-minute-per-ip: ${RATE_LIMIT_SMS_IP:10}
  jwt:
    # 生产环境必须通过 JWT_SECRET 覆盖；四个服务必须使用同一个值
    secret: ${JWT_SECRET:chengqu-huzhu-jwt-secret-key-change-me-in-production-2026}
    access-token-expire-minutes: ${JWT_ACCESS_EXPIRE_MINUTES:30}
    refresh-token-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:7}
    # 令牌吊销名单查询失败时是否拒绝请求。false=放行（默认，避免 Redis 故障导致全站无法登录）
    revocation-fail-closed: ${JWT_REVOCATION_FAIL_CLOSED:false}
  captcha:
    expire-seconds: 120
    length: 4
  sms:
    provider: mock
    code-length: 6
    expire-seconds: 300
    send-interval-seconds: 60
    daily-limit: 20
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    root: INFO
    com.chengqu.huzhu: INFO
