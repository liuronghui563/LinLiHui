server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/chengqu_huzhu?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: chengqu-huzhu-jwt-secret-key-change-me-in-production-2026
    access-token-expire-minutes: 30
    refresh-token-expire-days: 7
  captcha:
    expire-seconds: 120
    length: 4
  sms:
    provider: mock
    code-length: 6
    expire-seconds: 300
    send-interval-seconds: 60
    daily-limit: 20
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

logging:
  level:
    root: INFO
    com.chengqu.huzhu: INFO
